name: Build and verify CAD packages
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run verify:physics
      - run: npm run verify:packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-test-results
          path: |
            test-results/
            artifacts/
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mac:build
      - run: ditto -c -k --sequesterRsrc --keepParent 'apps/macos/build/Brickwright CAD.app' Brickwright-CAD-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Brickwright-CAD-macOS
          path: Brickwright-CAD-macOS.zip
          retention-days: 14
